<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; no plan, just commits</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05050a;
      --text: #e8e8ef;
      --dim: #5a5a72;
      --dim-readable: #8080a0;
      --glow-1: oklch(72% .18 280);
    }

    html { color-scheme: dark; }

    body {
      font-family: "SF Mono", ui-monospace, "Cascadia Code", "Fira Code", monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* ── cosmic backdrop ── */
    .cosmos {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .cosmos::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 50% 40% at 25% 35%, oklch(60% .25 280 / .18), transparent 70%),
        radial-gradient(ellipse 40% 55% at 75% 65%, oklch(65% .22 175 / .14), transparent 70%),
        radial-gradient(ellipse 60% 35% at 50% 20%, oklch(55% .20 230 / .12), transparent 70%);
      animation: nebula-drift 30s ease-in-out infinite alternate;
    }

    @keyframes nebula-drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-2%, 3%) scale(.97); }
      100% { transform: translate(-3%, -1%) scale(1.04); }
    }

    .cosmos::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 25% 68%, rgba(255,255,255,.5), transparent),
        radial-gradient(2px 2px at 42% 22%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 58% 85%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.5px 1.5px at 73% 38%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 88% 72%, rgba(255,255,255,.5), transparent);
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: .04;
      background-image:
        repeating-conic-gradient(#fff 0 .0001%, transparent 0 .0005%),
        repeating-conic-gradient(#fff 0 .0002%, transparent 0 .0008%);
      background-size: 200px 200px, 300px 300px;
      mix-blend-mode: overlay;
    }

    /* ── corners ── */
    .corners {
      position: fixed;
      z-index: 1;
      inset: 5vmin;
      pointer-events: none;
      animation: reveal 1.2s cubic-bezier(.16, 1, .3, 1) .5s both;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: color-mix(in oklch, var(--dim), transparent 30%);
      border-style: solid;
      border-width: 0;
    }

    .corner:nth-child(1) { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
    .corner:nth-child(2) { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
    .corner:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
    .corner:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

    /* ── content ── */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      text-align: center;
      padding: 0 6vw;
    }

    .code {
      font-size: clamp(2rem, 9vw, 3.5rem);
      font-weight: 400;
      letter-spacing: .2em;
      text-indent: .2em;
      color: color-mix(in oklch, var(--text), transparent 20%);
      animation: reveal .8s cubic-bezier(.16, 1, .3, 1) .2s both;
    }

    .message {
      font-size: .7rem;
      letter-spacing: .12em;
      line-height: 1.7;
      color: var(--dim-readable);
      animation: reveal .8s cubic-bezier(.16, 1, .3, 1) .4s both;
    }

    .back {
      position: relative;
      font-size: .7rem;
      letter-spacing: .12em;
      color: color-mix(in oklch, var(--text), transparent 25%);
      text-decoration: none;
      transition: color .3s;
      animation: reveal .8s cubic-bezier(.16, 1, .3, 1) .6s both;
    }

    .back::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--glow-1), transparent);
      transition: width .3s;
    }

    .back:hover { color: var(--text); }
    .back:hover::after { width: 100%; }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(6px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="cosmos" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <div class="corners" aria-hidden="true">
    <div class="corner"></div>
    <div class="corner"></div>
    <div class="corner"></div>
    <div class="corner"></div>
  </div>

  <main class="content">
    <h1 class="code">404</h1>
    <p class="message">// this one was never committed</p>
    <a class="back" href="/">back to no-plan.dev</a>
  </main>

</body>
</html>
