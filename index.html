  <style>
    @property --ray-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @property --morph {
      syntax: "<percentage>";
      initial-value: 30%;
      inherits: false;
    }
    @property --morph2 {
      syntax: "<percentage>";
      initial-value: 70%;
      inherits: false;
    }
    @property --scan {
      syntax: "<percentage>";
      initial-value: -10%;
      inherits: false;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05050a;
      --text: #e8e8ef;
      --dim: #5a5a72;
      --dim-readable: #8080a0;
      --glow-1: oklch(72% .18 280);
      --glow-2: oklch(75% .16 175);
      --glow-3: oklch(70% .15 230);
    }

    html { color-scheme: dark; }

    body {
      font-family: "SF Mono", ui-monospace, "Cascadia Code", "Fira Code", monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* ── cosmic backdrop ── */
    .cosmos {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .cosmos::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 50% 40% at 25% 35%, oklch(60% .25 280 / .18), transparent 70%),
        radial-gradient(ellipse 40% 55% at 75% 65%, oklch(65% .22 175 / .14), transparent 70%),
        radial-gradient(ellipse 60% 35% at 50% 20%, oklch(55% .20 230 / .12), transparent 70%),
        radial-gradient(ellipse 35% 50% at 15% 80%, oklch(60% .16 320 / .10), transparent 70%);
      animation: nebula-drift 30s ease-in-out infinite alternate;
    }

    @keyframes nebula-drift {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      25%  { transform: translate(3%, -2%) rotate(1deg) scale(1.05); }
      50%  { transform: translate(-2%, 3%) rotate(-0.5deg) scale(0.97); }
      75%  { transform: translate(1%, 1%) rotate(0.5deg) scale(1.02); }
      100% { transform: translate(-3%, -1%) rotate(-1deg) scale(1.04); }
    }

    .cosmos::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 25% 68%, rgba(255,255,255,.5), transparent),
        radial-gradient(2px 2px at 42% 22%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 58% 85%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.5px 1.5px at 73% 38%, rgba(255,255,255,.6), transparent),
        radial-gradient(2px 2px at 88% 72%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 5% 52%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 35% 45%, rgba(255,255,255,.35), transparent),
        radial-gradient(1.5px 1.5px at 62% 12%, rgba(255,255,255,.65), transparent),
        radial-gradient(1px 1px at 95% 55%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 18% 90%, rgba(255,255,255,.4), transparent),
        radial-gradient(2px 2px at 80% 8%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 48% 58%, rgba(255,255,255,.35), transparent),
        radial-gradient(1.5px 1.5px at 30% 30%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 68% 48%, rgba(255,255,255,.45), transparent);
      animation: stars-twinkle 8s ease-in-out infinite alternate;
    }

    @keyframes stars-twinkle {
      0%   { opacity: .7; }
      50%  { opacity: 1; }
      100% { opacity: .6; }
    }

    /* ── morphing blob ── */
    .blob {
      position: fixed;
      z-index: 0;
      width: clamp(300px, 55vmin, 550px);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      border-radius: 30% 70% var(--morph) var(--morph2) / var(--morph2) var(--morph) 70% 30%;
      background: conic-gradient(
        from var(--ray-angle),
        oklch(50% .22 280 / .16),
        oklch(45% .18 175 / .10),
        oklch(48% .16 230 / .14),
        oklch(50% .22 280 / .16)
      );
      filter: blur(60px);
      animation:
        morph 12s ease-in-out infinite alternate,
        ray-spin 20s linear infinite;
    }

    @keyframes morph {
      0%   { --morph: 30%; --morph2: 70%; }
      25%  { --morph: 55%; --morph2: 45%; }
      50%  { --morph: 70%; --morph2: 30%; }
      75%  { --morph: 40%; --morph2: 60%; }
      100% { --morph: 65%; --morph2: 35%; }
    }

    @keyframes ray-spin {
      to { --ray-angle: 360deg; }
    }

    /* ── scanline ── */
    .scanline {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        transparent var(--scan),
        oklch(85% .06 280 / .06) var(--scan),
        transparent calc(var(--scan) + 8%)
      );
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      to { --scan: 110%; }
    }

    /* ── noise ── */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: .04;
      background-image:
        repeating-conic-gradient(#fff 0 .0001%, transparent 0 .0005%),
        repeating-conic-gradient(#fff 0 .0002%, transparent 0 .0008%);
      background-size: 200px 200px, 300px 300px;
      mix-blend-mode: overlay;
    }

    /* ── content ── */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .heading {
      font-size: clamp(.65rem, 1.8vw, .8rem);
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: none;
      color: var(--dim);
      animation: reveal .8s cubic-bezier(.16, 1, .3, 1) .2s both;
    }

    /* ── social links ── */
    .socials {
      display: flex;
      gap: 1.5rem;
      animation: reveal .8s cubic-bezier(.16, 1, .3, 1) .4s both;
    }

    .socials a {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      color: var(--dim);
      text-decoration: none;
      transition: color .3s, transform .3s;
      isolation: isolate;
    }

    .socials a::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid color-mix(in oklch, var(--dim), transparent 40%);
      transition: border-color .3s, box-shadow .3s, scale .3s;
    }

    .socials a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle, oklch(72% .18 280 / .15), transparent 70%);
      opacity: 0;
      transition: opacity .3s;
      z-index: -1;
    }

    .socials a:hover {
      color: var(--text);
      transform: translateY(-3px);
    }

    .socials a:hover::before {
      border-color: var(--glow-1);
      box-shadow: 0 0 24px oklch(72% .18 280 / .25), inset 0 0 14px oklch(72% .18 280 / .06);
      scale: 1.08;
    }

    .socials a:hover::after {
      opacity: 1;
    }

    .socials svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      position: relative;
      z-index: 1;
    }

    /* ── projects ── */
    .projects {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      width: min(29rem, 84vw);
      animation: reveal .8s cubic-bezier(.16, 1, .3, 1) .6s both;
    }

    .project__head {
      display: flex;
      align-items: baseline;
      gap: .5rem 1rem;
    }

    .project__name {
      font-size: .7rem;
      letter-spacing: .12em;
      color: color-mix(in oklch, var(--text), transparent 25%);
    }

    .project__links {
      display: flex;
      gap: 1rem;
      padding-left: .4rem;
    }

    .project__links a {
      position: relative;
      font-size: .6rem;
      letter-spacing: .12em;
      color: var(--dim-readable);
      text-decoration: none;
      transition: color .3s;
    }

    .project__links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--glow-1), transparent);
      transition: width .3s;
    }

    .project__links a:hover { color: var(--text); }
    .project__links a:hover::after { width: 100%; }

    .project__desc {
      margin-top: .35rem;
      font-size: .62rem;
      line-height: 1.6;
      letter-spacing: .08em;
      color: var(--dim-readable);
    }


    /* ── structural lines ── */
    .h-lines {
      position: fixed;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      animation: reveal 1.2s cubic-bezier(.16, 1, .3, 1) .5s both;
    }

    .h-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, oklch(72% .18 280 / .10) 20%, oklch(72% .18 280 / .10) 80%, transparent 100%);
    }

    .h-line:nth-child(1) { top: 18%; }
    .h-line:nth-child(2) { top: 82%; }
    .h-line:nth-child(3) { left: 12%; right: auto; top: 0; bottom: 0; width: 1px; height: auto;
      background: linear-gradient(180deg, transparent 0%, oklch(72% .18 280 / .07) 30%, oklch(72% .18 280 / .07) 70%, transparent 100%); }
    .h-line:nth-child(4) { left: auto; right: 12%; top: 0; bottom: 0; width: 1px; height: auto;
      background: linear-gradient(180deg, transparent 0%, oklch(72% .18 280 / .07) 30%, oklch(72% .18 280 / .07) 70%, transparent 100%); }

    /* ── corners ── */
    .corners {
      position: fixed;
      z-index: 1;
      inset: 5vmin;
      pointer-events: none;
      animation: reveal 1.2s cubic-bezier(.16, 1, .3, 1) .5s both;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: color-mix(in oklch, var(--dim), transparent 30%);
      border-style: solid;
      border-width: 0;
    }

    .corner:nth-child(1) { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
    .corner:nth-child(2) { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
    .corner:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
    .corner:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

    /* ── coords ── */
    .coords {
      position: fixed;
      z-index: 1;
      font-size: .55rem;
      letter-spacing: .15em;
      color: color-mix(in oklch, var(--dim), transparent 30%);
      pointer-events: none;
      animation: reveal 1.2s cubic-bezier(.16, 1, .3, 1) .7s both;
    }

    .coords--tl { top: 5.5vmin; left: calc(12% + 12px); }
    .coords--br { bottom: 5.5vmin; right: calc(12% + 12px); }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(6px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
